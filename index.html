    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--fg);
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
      text-align: center; padding: 32px 20px; -webkit-font-smoothing: antialiased;
    }
    .box { width: 100%; max-width: 420px; }
    .logo { width: 116px; height: 34px; margin: 0 auto 34px;
      background: var(--logo) center / contain no-repeat; }
    h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 10px; }
    .lead { font-size: 1.02rem; font-weight: 300; color: var(--muted); margin: 0; line-height: 1.6; }
    .cta {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin: 36px auto 0; padding: 16px 22px; width: 100%;
      background: linear-gradient(145deg, var(--pink) 0%, var(--deep) 100%);
      color: #fff; text-decoration: none; border-radius: 15px;
      font-size: 1.05rem; font-weight: 600;
      transition: transform .2s cubic-bezier(.32,.72,0,1), filter .2s;
    }
    .cta:active { transform: scale(.98); filter: brightness(.92); }
